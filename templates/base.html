<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DistMod{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/console.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% include "partials/header.html" %}
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}

  <div class="toast" id="toast"></div>
  <script src="{{ url_for('static', filename='js/nacl.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/identity.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
